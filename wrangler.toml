name = "rss-worker"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ===== ENVIRONMENT VARIABLES =====
# Non-sensitive configuration only
[vars]
ENVIRONMENT = "production"

# ===== SECURITY NOTICE =====
# ALL SENSITIVE COOKIES MUST BE SET AS CLOUDFLARE SECRETS FOR PRODUCTION
# 
# Setup commands for production:
#   wrangler secret put WEIBO_COOKIES
#   wrangler secret put BILIBILI_COOKIES
# 
# Format for BILIBILI_COOKIES: UID=COOKIE_STRING|UID=COOKIE_STRING
# Example: 1466714313=your_cookie_string|9876543210=another_cookie
# 
# Alternative format (individual secrets per UID):
#   wrangler secret put BILIBILI_COOKIE_1466714313
#   wrangler secret put BILIBILI_COOKIE_9876543210
# 
# For local development:
#   Create a .dev.vars file (DO NOT COMMIT TO GIT)
#   Add your cookies there:
#     WEIBO_COOKIES="your_weibo_cookies_here"
#     BILIBILI_COOKIES="uid=cookie_string"
# 
# See .dev.vars.example for template

# [build]
# command = "npm run build"
# cwd = "dist"
# watch_dir = "dist"